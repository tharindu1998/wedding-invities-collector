    <title>Invitation link not found</title>
    <style>
      * { box-sizing: border-box; }
      body { min-width: 320px; min-height: 100vh; min-height: 100svh; display: grid; place-content: center; justify-items: center; gap: 14px; margin: 0; padding: 24px; background: radial-gradient(ellipse at center, #fffdfb 0%, #fbf6f1 58%, #f1e7dd 100%); color: #34292c; text-align: center; }
      .eyebrow { margin: 0; color: #8f505f; font: 700 10px/1.6 Arial, sans-serif; letter-spacing: .18em; text-transform: uppercase; }
      h1 { max-width: 520px; margin: 0; font: 500 clamp(28px, 5vw, 46px)/1.2 Georgia, serif; }
      p:last-child { margin: 0; color: #80666c; font: 15px/1.6 Georgia, serif; }
    </style>
  </head>
  <body>
    <p class="eyebrow">Page not found</p>
