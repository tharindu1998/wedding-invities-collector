[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/church-invitation"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/wedding-invitation"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

  [dev]
    command = "npm run dev:app"